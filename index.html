<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد الطبيب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="المناوبون حسب التخصص، ومراجع وبروتوكولات سريعة للأطباء">
<meta name="theme-color" content="#0c1222">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مساعد الطبيب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: night-shift board — specialty sidebar on wide screens, dept cards with one tile per level; phones get a top header + bottom tabs.
   One deliberate dark navy look (the user's chosen reference), so no light theme. */
:root{
  --bg:#0c1222; --surface:#141c30; --raise:#1a2440; --ink:#e8edf7; --muted:#8a96b2; --line:#26324e;
  --accent:#4f7cff; --accent-ink:#ffffff; --accent-soft:#1c2b55;
  --live:#3ddc84; --alert:#ff7a7a; --alert-soft:#3a1c26;
  --res:#f5c44e; --res-soft:#2e2717; --spec:#ff8a8a; --spec-soft:#331c25; --cons:#8cc8ff; --cons-soft:#172a44;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",-apple-system,"SF Arabic",Tahoma,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="ltr"] .flip{transform:scaleX(-1)}
.wrap{max-width:720px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

header{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.mark{width:44px;height:44px;border-radius:12px;background:#e9f3fb;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,#5aa9e6 40%,transparent)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.mark svg.i{width:24px;height:24px;stroke-width:2.2}
header .ttl{flex:1;min-width:0}
header h1{margin:0;font-size:1.12rem;font-weight:700;line-height:1.3}
header p{margin:0;font-size:.8rem;color:var(--muted)}
.lang{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;
  font:600 .8rem var(--f-body);cursor:pointer;display:flex;align-items:center;gap:6px}
.lang svg.i{width:16px;height:16px}

main.wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.search{position:relative;display:block}
.search svg.i{position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding-block:13px;padding-inline:44px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  margin-left:calc(-1 * var(--gutter-l));margin-right:calc(-1 * var(--gutter-r));
  padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:6px 14px;font:500 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.status.demo .dot{background:var(--spec);box-shadow:0 0 0 3px var(--spec-soft)}
.status bdi{font-family:var(--f-data)}

.group{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.group h2{margin:2px 2px 0;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.row + .row{border-top:1px solid var(--line)}
a.row:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tile{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.txt{min-width:0;flex:1}
.row b{display:block;font-weight:600;font-size:.95rem;line-height:1.35}
.row .sub{display:block;font-size:.8rem;color:var(--muted);line-height:1.4}
.dom{display:block;font-family:var(--f-data);font-size:.72rem;color:var(--muted);opacity:.8}
.ext,.del{color:var(--muted)}
.del{border:0;background:none;padding:6px;cursor:pointer;border-radius:8px}
.del:hover{color:var(--alert);background:var(--alert-soft)}

/* on-call */
.dept{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dept-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dept-h b{flex:1;font-weight:700}
.dept-h .count{font-size:.75rem;color:var(--muted)}
.doc{display:flex;align-items:center;gap:12px;padding:11px 14px}
.doc + .doc{border-top:1px solid var(--line)}
.lvl{flex:none;width:86px;text-align:center;font-size:.72rem;font-weight:600;border-radius:7px;padding:3px 0}
.lvl.res{background:var(--res-soft);color:var(--res)}
.lvl.spec{background:var(--spec-soft);color:var(--spec)}
.lvl.cons{background:var(--cons-soft);color:var(--cons)}
.lvl.oth{background:var(--bg);color:var(--muted)}
.doc .txt b{font-weight:600;font-size:.93rem}
.doc .sub{font-size:.78rem;color:var(--muted)}
.doc .sub bdi{font-family:var(--f-data)}
.call{display:flex;gap:6px}
.call a,.call button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--accent);
  display:grid;place-items:center;cursor:pointer;text-decoration:none}
.call svg.i{width:17px;height:17px}
.none{padding:12px 14px;color:var(--muted);font-size:.85rem}

.add{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.add input{min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem}
.add button{border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);padding:0 12px;display:grid;place-items:center;cursor:pointer}
@media (max-width:420px){.add{grid-template-columns:1fr auto}.add input[name=u]{grid-column:1/-1;grid-row:2}}

details.proto{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.proto summary{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;list-style:none}
details.proto summary::-webkit-details-marker{display:none}
details.proto .tile{background:var(--alert-soft);color:var(--alert)}
details.proto summary b{display:block;font-weight:600}
details.proto summary .sub{font-size:.8rem;color:var(--muted)}
details.proto .chev{transition:transform .2s;color:var(--muted)}
details.proto[open] .chev{transform:rotate(-90deg)}
[dir="ltr"] details.proto[open] .chev{transform:scaleX(-1) rotate(-90deg)}
.targets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.target{font-size:.75rem;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.target bdi{font-family:var(--f-data);color:var(--ink)}
.steps{margin:0;padding-block:4px 16px;padding-inline:34px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.steps li::marker{color:var(--accent);font-weight:600}
.dose{font-family:var(--f-data);font-size:.82rem;direction:ltr;unicode-bidi:isolate;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:5px;white-space:nowrap}
.note{display:flex;gap:10px;font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:0}
.empty{color:var(--muted);text-align:center;padding:28px 0;margin:0}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
nav.tabs div{max-width:460px;margin:0 auto;display:flex;gap:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);
  font:500 .75rem var(--f-body);padding:6px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1122/600;width:100%;max-width:820px;margin-inline:auto;border:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;max-width:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to bottom,transparent,var(--bg))}
.lockup{height:46px;width:auto;max-width:100%;border-radius:10px;display:block;flex:none}
header h1{font-size:1rem}
@media (min-width:900px){.side .brand{flex-direction:column;align-items:stretch;gap:10px}.side .brand .lockup{width:100%;height:auto;border-radius:12px}.side .brand span{padding:0 4px}}
/* live touches */
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero img{animation:kb 18s ease-in-out infinite alternate;transform-origin:70% 20%}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.datepill .dot{animation:pulse 1.8s ease-out infinite}
.datepill bdi{font-family:var(--f-data);color:var(--live)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.dcard{animation:rise .45s ease-out both}
.dtile .bar{width:100%;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin-top:6px}
.dtile .bar i{display:block;height:100%;border-radius:4px;background:currentColor}
.dtile.res .bar{color:var(--res)} .dtile.spec .bar{color:var(--spec)} .dtile.cons .bar{color:var(--cons)}
.dtile .left{font-size:.68rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hero img,.datepill .dot,.dcard{animation:none}}
/* board view */
.board-h{display:flex;flex-direction:column;gap:6px}
.datepill{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);
  border-radius:999px;padding:5px 14px;font-size:.82rem;font-weight:600}
.datepill .dot,.status .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 20%,transparent)}
.board-h .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.addbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700;text-decoration:none;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.addbtn svg.i{width:18px;height:18px}
.board-h h2{margin:0;font-size:1.45rem;font-weight:700;text-wrap:balance}
.board-h p{margin:0;color:var(--muted);font-size:.85rem}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dcard-h{display:flex;align-items:center;gap:10px}
.dcard-h .tile{background:var(--raise);color:var(--spec)}
.dcard-h b{display:block;font-size:1.02rem;font-weight:700;line-height:1.3}
.dcard-h small{display:block;color:var(--muted);font-size:.75rem;direction:ltr;text-align:start}
[dir="rtl"] .dcard-h small{text-align:right}
.dcard-h .count{margin-inline-start:auto;font-size:.75rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dtile{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0;background:var(--bg)}
.dtile .code{font:600 .66rem var(--f-data);letter-spacing:.12em;color:var(--muted)}
.dtile .lv{font-size:.72rem;color:var(--muted)}
.dtile b{font-size:.98rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.dtile .ph{font:600 .8rem var(--f-data);color:#5ee0d0;direction:ltr;text-decoration:none}
.dtile .tm{font:500 .7rem var(--f-data);color:var(--muted);direction:ltr}
.dtile .call{display:none}
.dtile.res{border-color:color-mix(in srgb,var(--res) 55%,transparent);background:var(--res-soft)} .dtile.res b{color:var(--res)}
.dtile.spec{border-color:color-mix(in srgb,var(--spec) 55%,transparent);background:var(--spec-soft)} .dtile.spec b{color:var(--spec)}
.dtile.cons{border-color:color-mix(in srgb,var(--cons) 55%,transparent);background:var(--cons-soft)} .dtile.cons b{color:var(--cons)}
.dtile.none{border-style:dashed;opacity:.55} .dtile.none b{color:var(--muted)}

/* phones: keep the three levels side by side like the wide board */
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .dcard{padding:12px;gap:10px;border-radius:16px}
  .dtile{padding:8px 4px;border-radius:10px;gap:1px}
  .dtile .code{font-size:.58rem;letter-spacing:.08em}
  .dtile .lv{font-size:.66rem}
  .dtile b{font-size:.8rem}
  .dtile .ph{font-size:.66rem}
  .dtile .tm{font-size:.6rem}
  .board-h h2{font-size:1.25rem}
  .addbtn{padding:8px 12px;font-size:.85rem}
}
/* wide screens: sidebar replaces header, chips and tab bar */
aside.side{display:none}
@media (min-width:900px){
  body{padding-bottom:0}
  header,nav.tabs,#chips{display:none!important}
  .shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  aside.side{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-inline-end:1px solid var(--line);
    padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .shell main.wrap{max-width:1100px;width:100%;padding-block:24px}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
  .side .brand b{display:block;font-weight:700}
  .side .brand small{display:block;color:var(--muted);font-size:.75rem}
  .side .lang{align-self:stretch;justify-content:center;margin-bottom:8px}
  .side h3{margin:12px 8px 4px;font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .side .nav{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:500 .9rem var(--f-body);
    padding:9px 10px;border-radius:10px;cursor:pointer;text-align:start;width:100%}
  .side .nav:hover{background:var(--raise)}
  .side .nav[aria-current="true"]{background:var(--accent-soft);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
  .side .nav .n{margin-inline-start:auto;font:500 .7rem var(--f-data);background:var(--raise);color:var(--muted);border-radius:999px;padding:1px 8px}
}
</style>
</head>

function levelOf(r){
  if (LEVELS.includes(r.level)) return r.level;
  const s = `${r.shift} ${r.note}`.toLowerCase();
  if (/استشار|consult/.test(s)) return "cons";

}

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hm = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

// A row without times covers its whole date; a shift that ends at or before its start runs past midnight.
function covers(r, now){
  const s = new Date(`${r.day}T${r.start_t || "00:00"}`);
  if (!r.start_t || !r.end_t) return r.day === ymd(now);
  const e = new Date(`${r.day}T${r.end_t}`);
  if (e <= s) e.setDate(e.getDate() + 1);
  return s <= now && now < e;
}

function groupNow(rows, fetchedAt){
  const now = new Date(), by = {};
  rows.filter(r => covers(r, now)).forEach(r => (by[r.dept] ||= []).push(
    {level: r.level, name: r.name, phone: r.phone, shift: "", start: r.start_t, end: r.end_t, note: r.note, day: r.day}));
  return {at: fetchedAt, depts: Object.keys(by).sort((a, b) => a.localeCompare(b, "ar")).map(dept => ({dept, rows: by[dept]}))};
}

// Arabic-Indic digits typed on Arabic keyboards become Latin, so ٠١٢٣ matches 0123.
const digits = s => String(s ?? "").trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\s+/g, "");
let lockMsg = "", me = "";
function signOut(){ ["dh-emp", "dh-pin", "dh-rows", "dh-me"].forEach(k => store.set(k, null)); lockMsg = ""; loadDuty(); }
async function loadDuty(){
  if (!CFG.url || location.hash === "#demo") { duty = DEMO; dutySrc = "demo"; return render(); }
  const emp = store.get("dh-emp", null), pin = store.get("dh-pin", null), saved = store.get("dh-rows", null);
  me = store.get("dh-me", "") || "";
  if (saved) { duty = groupNow(saved.rows, saved.at); dutySrc = "cached"; render(); }
  try {
    const now = new Date(), y = new Date(now); y.setDate(y.getDate() - 1);
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 10000);
    const r = await fetch(`${CFG.url}/rest/v1/rpc/get_duty`, {method: "POST", signal: ctl.signal, cache: "no-store",
      headers: {"Content-Type": "application/json", apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`},
      body: JSON.stringify({p_emp: emp || "", p_pin: pin || "", p_from: ymd(y), p_to: ymd(now)})});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.ok) {
      ["dh-pin", "dh-rows"].forEach(k => store.set(k, null));
      duty = {at: "", depts: []}; dutySrc = "locked"; lockMsg = emp && pin ? "lock_" + (d.reason || "bad") : ""; return render();
    }
    const at = hm(now);
    me = d.name || ""; store.set("dh-me", me);
    // Until the first roster is uploaded, show the marked demo board instead of an empty page.
    if (!d.rows.length) { duty = DEMO; dutySrc = "demo"; store.set("dh-rows", null); return render(); }
    store.set("dh-rows", {rows: d.rows, at});
    duty = groupNow(d.rows, at); dutySrc = "live"; render();
  } catch {
    if (!saved) { duty = {at: "", depts: []}; dutySrc = "locked"; lockMsg = "lock_net"; render(); }
  }
}

function renderLock(){
  const inp = `padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;width:100%`;
  document.getElementById("view").innerHTML = `
    <form class="dept" id="lock" style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:12px;align-items:center"><span class="tile">${icon("steth")}</span>
        <span class="txt"><b>${t("lock_t")}</b><span class="sub">${t("lock_p")}</span></span></div>
      <label class="sub" for="lock-emp">${t("emp")}</label>
      <input id="lock-emp" inputmode="numeric" autocomplete="username" required dir="ltr" style="${inp}" value="${esc(store.get("dh-emp", "") || "")}">
      <label class="sub" for="lock-pin">${t("pin")}</label>
      <input id="lock-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required dir="ltr" style="${inp};letter-spacing:.4em">
      ${lockMsg ? `<p class="sub" style="margin:0;color:var(--alert)">${t(lockMsg) || t("lock_bad")}</p>` : ""}
      <button class="lang" style="justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;padding:12px">${t("lock_b")}</button>
    </form>`;
  return 1;
}
document.addEventListener("submit", e => {
  if (e.target.id !== "lock") return;
  e.preventDefault();
  store.set("dh-emp", digits(document.getElementById("lock-emp").value));
  store.set("dh-pin", digits(document.getElementById("lock-pin").value));
  lockMsg = ""; loadDuty();
});

function renderChips(){
  const el = document.getElementById("chips");
  let cats = [];
  if (tab === "links") cats = [["all", t("all")], ...LINKS.map(g => [g.id, L(g.cat)]), ["mine", t("mine")]];
  if (tab === "oncall") cats = [["all", t("all")], ...duty.depts.map(d => [d.dept, deptName(d.dept)])];
  el.hidden = !cats.length;
  el.innerHTML = cats.map(([id, n]) => `<button class="chip" data-cat="${esc(id)}" aria-pressed="${id === cat}">${esc(n)}</button>`).join("");
}

function renderOncall(q){
  if (dutySrc === "locked") return renderLock();
  const st =dutySrc === "demo" ? `<p class="status demo"><span class="dot"></span>${t("demo")}</p>`
    : `<p class="status"><span class="dot"></span>${me ? `${t("hello")} ${esc(me)} · ` : ""}${t(dutySrc)} <bdi>${esc(duty.at)}</bdi>
        ${me ? `<button id="signout" style="margin-inline-start:auto;border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer">${t("signout")}</button>` : ""}</p>`;
  const today = new Date().toLocaleDateString(lang === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB", {weekday: "long", day: "numeric", month: "long"});
  const head = `<div class="board-h"><span class="datepill"><span class="dot"></span>${esc(today)} · <bdi>${hm(new Date())}</bdi></span>
    <div class="top"><div><h2>${t("board")}</h2><p>${t("board_p")}</p></div>
      <a class="addbtn" href="admin.html">${icon("plus")}${t("add")}</a></div></div>`;
  let hits = 0;
  const cards = duty.depts.filter(d => cat === "all" || cat === d.dept).map(d => {
    const rows = d.rows.map(r => ({...r, lv: levelOf(r)}));
    const deptHit = has(q, d.dept, deptName(d.dept));
    const shown = rows.filter(r => deptHit || has(q, r.name));
    if (!shown.length) return "";
    hits += shown.length;
    const order = [...LEVELS, "oth"].filter(l => l !== "oth" || shown.some(r => r.lv === "oth"));
    const tiles = order.flatMap(l => {
      const docs = shown.filter(r => r.lv === l);
      if (!docs.length) return q ? [] : [`<div class="dtile none"><span class="code">${CODE[l]}</span><span class="lv">${t(l)}</span><b>—</b></div>`];
      return docs.map(r => `<div class="dtile ${l}"><span class="code">${CODE[l]}</span><span class="lv">${t(l)}</span>
        <b>${esc(r.name)}</b>
        ${r.phone ? `<a class="ph" href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ""}
        ${r.start ? `<span class="tm">${esc(r.start)}–${esc(r.end)}</span>` : ""}${progress(r)}
        ${r.phone ? `<span class="call"><button data-copy="${esc(r.phone)}" aria-label="${t("copy")}">${icon("copy")}</button>
          <a href="tel:${esc(r.phone)}" aria-label="${t("call")} ${esc(r.name)}">${icon("phone")}</a></span>` : ""}</div>`);
    }).join("");
    const other = lang === "ar" ? (DEPT_EN[d.dept] || "") : d.dept;
    return `<div class="dcard" style="animation-delay:${Math.min(hits, 12) * 40}ms"><div class="dcard-h"><span class="tile">${icon(deptIcon(d.dept))}</span>
      <span><b>${esc(deptName(d.dept))}</b>${other && other !== deptName(d.dept) ? `<small>${esc(other)}</small>` : ""}</span>
      <span class="count">${shown.length} ${t("doctors")}</span></div><div class="tiles">${tiles}</div></div>`;
  }).join("");
  document.getElementById("view").innerHTML = head + st + (cards || (q ? "" : `<p class="empty">${t("empty_now")}</p>`));
  return hits || (q ? 0 : 1);
}

const CODE = {res: "RES", spec: "SPEC", cons: "CONS", oth: "ON-CALL"};

// How far into the shift we are, and what's left: "باقي 5س 20د". Shifts ending at or before their start run past midnight.
function progress(r){
  if (!r.start || !r.end) return "";
  const now = new Date(), base = r.day || ymd(now);
  let s = new Date(`${base}T${r.start}`), e = new Date(`${base}T${r.end}`);
  if (e <= s) e.setDate(e.getDate() + 1);
  if (!r.day && now < s) { s.setDate(s.getDate() - 1); e.setDate(e.getDate() - 1); }
  if (now < s || now >= e) return "";
  const pct = Math.round((now - s) / (e - s) * 100), mins = Math.round((e - now) / 60000);
  const left = lang === "ar" ? `باقي ${Math.floor(mins / 60)}س ${mins % 60}د` : `${Math.floor(mins / 60)}h ${mins % 60}m left`;
  return `<span class="bar"><i style="width:${pct}%"></i></span><span class="left">${left}</span>`;
}
setInterval(() => { if (tab === "oncall" && document.activeElement?.id !== "lock-emp" && document.activeElement?.id !== "lock-pin") render(); }, 60000);
// Department icon by keywords (Arabic or English), most specific first.
const DEPT_RULES = [
  [/مخ|neurosurg/i, "brain"], [/جراح|surg/i, "scalpel"], [/باطن|internal|medicine/i, "steth"], [/قلب|cardi/i, "heart"],
  [/أعصاب|اعصاب|neuro/i, "brain"], [/أطفال|اطفال|حديثي|pediat|paed|nicu|neonat/i, "baby"], [/نساء|ولادة|توليد|obstet|gyn|\bob\b/i, "female"],
  [/عظام|ortho/i, "bone"], [/أنف|انف|أذن|حنجرة|\bent\b|otol/i, "ear"], [/عيون|عين|ophth|eye/i, "eye"], [/مسالك|كلى|uro|nephro|renal/i, "drop"],
  [/جلد|derm/i, "hand"], [/نفسي|psych/i, "smile"], [/أشعة|اشعة|radio|imaging/i, "scan"], [/تخدير|anest/i, "syringe"],
  [/طوارئ|emerg|\ber\b/i, "siren"], [/عناية|icu|critical/i, "ecg"], [/أسنان|اسنان|dent/i, "tooth"], [/صدر|رئة|chest|pulmo|respir/i, "lungs"],
];
const deptIcon = d => (DEPT_RULES.find(([rx]) => rx.test(d) || rx.test(DEPT_EN[d] || "")) || [0, "steth"])[1];

function renderSide(){
  const navs = [["oncall", "steth", t("t_oncall")], ["links", "link", t("t_links")], ["protocols", "clip", t("t_protocols")]];
  const depts = tab === "oncall" && dutySrc !== "locked" ? duty.depts : [];
  document.getElementById("side").innerHTML = `
    <div class="brand"><img class="lockup" src="img/lockup.png" alt="مستشفى صامطة العام"><span><b>${t("app")}</b><small>${t("tag")}</small></span></div>
    <button class="lang" data-action="lang">${icon("globe")}<span>${t("other")}</span></button>
    <h3>${t("menu")}</h3>
    ${navs.map(([id, ic, n]) => `<button class="nav" data-tab="${id}" aria-current="${tab === id && cat === "all"}">${icon(ic)}${n}</button>`).join("")}
    ${depts.length ? `<h3>${t("specialties")}</h3>` + depts.map(d =>
      `<button class="nav" data-cat="${esc(d.dept)}" aria-current="${cat === d.dept}">${icon(deptIcon(d.dept))}${esc(deptName(d.dept))}<span class="n">${d.rows.length}</span></button>`).join("") : ""}`;
}
document.getElementById("side").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.action === "lang") return document.getElementById("lang").click();
  if (b.dataset.tab) { tab = b.dataset.tab; cat = "all"; store.set("dh-tab", tab); document.getElementById("q").value = ""; }
  if (b.dataset.cat) cat = cat === b.dataset.cat ? "all" : b.dataset.cat;
  render();
});

function linkRow([n, d, u, ic], i){
  return `<a class="row" href="${esc(u)}" target="_blank" rel="noopener">
    <span class="tile">${icon(ic)}</span>
    <span class="txt"><b>${esc(L(n))}</b><span class="sub">${esc(L(d))}</span><bdi class="dom">${esc(host(u))}</bdi></span>
    ${i !== undefined ? `<button class="del" data-i="${i}" aria-label="${t("del")}">${icon("x")}</button>` : icon("out", "ext flip")}
  </a>`;
}

function renderLinks(q){
  const mine = store.get("dh-custom-links", []);
  const groups = [...LINKS, {id:"mine", cat:{ar:T.ar.mine, en:T.en.mine}, mine:true,
    items: mine.map(c => [c.n, {ar:T.ar.personal, en:T.en.personal}, c.u, "link"])}];
  let html = "", hits = 0;
  for (const g of groups){
    if (cat !== "all" && cat !== g.id) continue;
    const items = g.items.map((it, i) => [it, i]).filter(([[n, d, u]]) =>
      has(q, L(n), L(d), u, L(g.cat), n.ar || "", n.en || "", d.ar || "", d.en || ""));
    if (!items.length && !(g.mine && !q)) continue;
    hits += items.length;
    html += `<div class="group"><h2>${esc(L(g.cat))}</h2><div class="list">` +
      items.map(([it, i]) => linkRow(it, g.mine ? i : undefined)).join("") +
      (g.mine && !q ? `<form class="add" id="add">
        <input id="add-n" name="n" placeholder="${t("name")}" required>
        <input id="add-u" name="u" type="url" placeholder="https://" required dir="ltr">
        <button aria-label="${t("add")}">${icon("plus")}</button></form>` : "") + `</div></div>`;
  }
  document.getElementById("view").innerHTML = html;
  return hits;
}

function renderProtocols(q){
  const items = PROTOCOLS.filter(p => has(q, p.t.ar, p.t.en, p.s, p.k, p.b.ar.join(" "), p.b.en.join(" ")));
  document.getElementById("view").innerHTML = items.map(p => `
    <details class="proto"${q ? " open" : ""}>
      <summary><span class="tile">${icon(p.ic)}</span>
        <span class="txt"><b>${L(p.t)}</b><span class="sub">${p.s}</span></span>${icon("back", "chev")}</summary>
      <div class="targets">${p.tg.map(([l, v]) => `<span class="target">${L(l)} <bdi>${v}</bdi></span>`).join("")}</div>
      <ol class="steps">${L(p.b).map(x => `<li>${x}</li>`).join("")}</ol>
    </details>`).join("") +
    (items.length ? `<p class="note">${icon("info")}<span>${t("disclaimer")}</span></p>` : "");
  return items.length;
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("app");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelector("#lang span").textContent = t("other");
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const qi = document.getElementById("q");
  qi.placeholder = t("q_" + tab); qi.setAttribute("aria-label", t("q_" + tab));
  renderChips();
  const q = qi.value.trim().toLowerCase();
  const n = tab === "oncall" ? renderOncall(q) : tab === "links" ? renderLinks(q) : renderProtocols(q);
  const e = document.getElementById("empty");
  e.textContent = t("none"); e.hidden = !(q && !n);
  renderSide();
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("dh-lang", lang); render(); };
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  tab = b.dataset.tab; cat = "all"; store.set("dh-tab", tab);
  document.getElementById("q").value = ""; render();
});
document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  cat = c.dataset.cat; render();
});
document.addEventListener("submit", e => {
  if (e.target.id !== "add") return;
  e.preventDefault();
  const f = new FormData(e.target);
  store.set("dh-custom-links", [...store.get("dh-custom-links", []), {n: f.get("n"), u: f.get("u")}]);
  render();
});
document.addEventListener("click", e => {
  const d = e.target.closest(".del");
  if (d){
    e.preventDefault();
    const a = store.get("dh-custom-links", []); a.splice(+d.dataset.i, 1); store.set("dh-custom-links", a); render();
    return;
  }
  if (e.target.id === "signout") return signOut();
  const c = e.target.closest("[data-copy]");
  if (c){
    const done = () => { c.innerHTML = icon("check"); setTimeout(() => c.innerHTML = icon("copy"), 1500); };
    navigator.clipboard?.writeText(c.dataset.copy).then(done, () => {});
  }
});

if (!T[lang]) lang = "ar";
if (!["oncall", "links", "protocols"].includes(tab)) tab = "oncall";
loadDuty();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
